# Сервер: программа сама раз в период читает Telegram-каналы и добавляет новые ассеты.
#
#   ./deploy.sh   — спросит всё нужное, проверит по шагам и запустит эту службу.
#
# Вручную: cp .env.example .env, заполнить, docker compose up -d --build.
#
# Логи:        docker compose logs -f        (и файлы в ./logs)
# Остановить:  docker compose down
services:
  unity-assets:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: unity-assets-downloader
    container_name: unity-assets-downloader
    # Постоянное имя: по нему браузер узнаёт свою блокировку папки после перезапуска.
    hostname: unity-assets
    restart: unless-stopped
    # init убирает зависшие процессы браузера, если он упадёт посреди работы.
    init: true
    shm_size: "1gb"
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    command:
      - "--watch"
      - "--watch-interval"
      - "${WATCH_INTERVAL:-24h}"
      - "--profile"
      - "${PROFILE:-server}"
      # Что читать: telegram (только каналы), top-free (+ страница топа бесплатных),
      # all (+ китайский архив и расширенные списки). Меняется в .env.
      - "--sources"
      - "${SOURCES:-telegram}"
      - "--quiet"
    volumes:
      # Сессия Unity, память профиля (что уже добавлено), где остановилось чтение каналов.
      - ./data:/app/data
      - ./logs:/app/logs
      # Каналы берутся из TELEGRAM_CHANNELS в .env (его пишет deploy.sh). Если там пусто —
      # из этого файла; правка подхватится в следующем прогоне.
      - ./telegram_sources.txt:/app/telegram_sources.txt:ro
