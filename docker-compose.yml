# Сервер: программа сама раз в период читает Telegram-каналы и добавляет новые ассеты.
#
#   ./deploy.sh   — спросит всё нужное, проверит по шагам и запустит эту службу.
#
# Вручную: cp .env.example .env, заполнить, docker compose up -d --build.
#
# Логи:        docker compose logs -f        (и файлы в ./logs)
# Остановить:  docker compose down
services:
  unity-assets:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: unity-assets-downloader
    container_name: unity-assets-downloader
    # Постоянное имя: по нему браузер узнаёт свою блокировку папки после перезапуска.
    hostname: unity-assets
    # Ещё и сторож прогона (RUN_STALL_MINUTES): зависшая служба выходит с кодом 3, и Docker поднимает её заново.
    restart: unless-stopped
    # init убирает зависшие процессы браузера, если он упадёт посреди работы.
    init: true
    shm_size: "1gb"
    # Сервер общий и тесный по памяти: если её не хватит, система должна остановить нас,
    # а не соседние службы.
    oom_score_adj: 500
    # Окно браузера для человека (Fab: вход в Epic, галочка). Слушает ТОЛЬКО localhost сервера;
    # попасть можно по SSH-туннелю: ssh -L 127.0.0.1:6085:127.0.0.1:6085 <сервер>, затем
    # http://127.0.0.1:6085/vnc.html (именно 127.0.0.1, не localhost: localhost может уйти в IPv6). Внутри контейнера порт открывается только на время просьбы к человеку.
    ports:
      - "127.0.0.1:${FAB_VNC_PORT:-6085}:6085"
      # Окно Fab с телефона без туннеля (FAB_PHONE_LINK=http|https, ./deploy.sh). Пока режим выключен — только localhost;
      # включён — deploy.sh пишет FAB_PHONE_BIND=0.0.0.0. Внутри порт слушается только во время входа по кнопке
      # «📱 С телефона» (одноразовая ссылка на 15 мин), в остальное время соединение сразу отклоняется.
      - "${FAB_PHONE_BIND:-127.0.0.1}:${FAB_PHONE_PORT:-7443}:7443"
    # Вывод службы (docker compose logs) не должен съесть диск: храним до 3 файлов по 10 МБ —
    # это несколько месяцев прогонов.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    command:
      - "--watch"
      - "--watch-interval"
      - "${WATCH_INTERVAL:-24h}"
      - "--profile"
      - "${PROFILE:-server}"
      # Что читать: telegram (только каналы), top-free (+ страница топа бесплатных),
      # all (+ китайский архив и расширенные списки). Меняется в .env.
      - "--sources"
      - "${SOURCES:-telegram}"
      - "--quiet"
    volumes:
      # Сессия Unity, память профиля (что уже добавлено), где остановилось чтение каналов.
      - ./data:/app/data
      - ./logs:/app/logs
      # Общий список каналов: читается всегда, вместе с TELEGRAM_CHANNELS из .env (тем, что добавлено
      # только на этом сервере). Правка файла подхватывается в следующем прогоне.
      - ./telegram_sources.txt:/app/telegram_sources.txt:ro
      # Сертификат домена для окна с телефона (HTTPS): только папки этого домена из /etc/letsencrypt и только для чтения;
      # пути те же, что на сервере, — иначе ссылки live → archive не сработают. Без HTTPS — пустые папки в data/.
      - "${FAB_PHONE_CERT_LIVE:-./data/no-phone-cert/live}:${FAB_PHONE_CERT_LIVE:-/opt/no-phone-cert/live}:ro"
      - "${FAB_PHONE_CERT_ARCHIVE:-./data/no-phone-cert/archive}:${FAB_PHONE_CERT_ARCHIVE:-/opt/no-phone-cert/archive}:ro"
